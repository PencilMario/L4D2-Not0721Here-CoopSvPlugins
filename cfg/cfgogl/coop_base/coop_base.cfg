// 多特设置
confogl_addcvar si_spawn_auto_interval_reduction 2
confogl_addcvar si_spawn_auto_base_interval 35
confogl_addcvar si_spawn_auto_base_specials 3
confogl_addcvar si_spawn_auto_specials_per_player 1
confogl_addcvar nff_enable 0
sm_setammomulti 6

// 降智节约性能
confogl_addcvar ib_process_time 0.35
confogl_addcvar ib_vision_noticetimescale 1.4
// 关闭自瞄来给萌新一点游戏体验
exec cfgogl/coop_base/shared_setting.cfg