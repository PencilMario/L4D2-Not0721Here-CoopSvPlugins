// 多特设置
confogl_addcvar si_spawn_auto_interval_reduction 0
confogl_addcvar si_spawn_auto_base_interval 0
confogl_addcvar si_spawn_auto_base_specials 5
confogl_addcvar si_spawn_auto_specials_per_player 1
confogl_addcvar teleport_enable 1
confogl_addcvar automatic_healing_enable 1
confogl_addcvar sm_killheal_enable 1
confogl_addcvar si_spawn_relax_enabled 0
confogl_addcvar l4d2_melee_damage_charger 350
// 投掷物立刻出手
confogl_addcvar grenade_throw_windup_time 0.0
confogl_addcvar grenade_throw_delay 0.1

// 3倍备弹
sm_setammomulti 3
confogl_addcvar sm_aidmgfix_enable 3
confogl_addcvar vb_changedifficulty "z"
confogl_addcvar l4d_plp_cannonspecuse 0

confogl_addcvar upgrade_incendiary_multi 2.0
confogl_addcvar upgrade_explosive_multi 2.0

exec cfgogl/coop_base/shared_setting.cfg
